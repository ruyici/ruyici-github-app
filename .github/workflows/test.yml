name: test

on:
  pull_request:
    paths:
      - control-plane/**
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r control-plane/requirements.txt
      - run: python -m pytest -q
        working-directory: control-plane
